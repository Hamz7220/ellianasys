# Netlify configuration for Elliana
# No build step: the whole app is static (index.html + assets).

[build]
  publish = "."
  command = ""

# Single-page app: always serve index.html (any deep link falls back to it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible caching + security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
